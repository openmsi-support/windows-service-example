# yaml-language-server: $schema=https://openmsi.dev/schemas/openmsi-dialog-v1.schema.json

dialog:
  name: MaintenanceWelcomeDlg
  firstControl: Next
  defaultControl: Next
  cancelControl: Cancel

controls:
  - type: Text
    name: Title
    text: "{\\OpenMSI_Font_Bigger}Welcome to the [ProductName] Setup Wizard"
    x: 135
    y: 20
    width: 220
    height: 60

  - type: Text
    name: Description
    text: The Setup Wizard allows you to change the way [ProductName] is installed on your computer or to remove it from your computer. Click Next to continue or Cancel to exit the Setup Wizard.
    x: 135
    y: 70
    width: 220
    height: 60
    attributes: [Visible, Enabled, NoPrefix, Transparent]

  - type: Bitmap
    name: Bitmap
    text: OpenMSI_BmpBackground
    x: 0
    y: 0
    width: 370
    height: 234
    nextControl: Back

  - type: Line
    name: BottomLine
    x: 0
    y: 234
    width: 370
    height: 0

  - type: PushButton
    name: Next
    text: "&Next"
    x: 236
    y: 243
    nextControl: Cancel
    events:
      - event: NewDialog
        argument: MaintenanceTypeDlg
      - event: SpawnWaitDialog
        argument: WaitForCostingDlg
        condition: 1 OR CostingComplete = 1
    
  - type: PushButton
    name: Cancel
    text: "&Cancel"
    x: 304
    y: 243
    nextControl: Bitmap
    events:
      - event: SpawnDialog
        argument: CancelDlg

  - type: PushButton
    name: Back
    text: "&Back"
    x: 180
    y: 243
    nextControl: Next
    attributes: [Visible]
