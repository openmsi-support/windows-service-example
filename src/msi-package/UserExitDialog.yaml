# yaml-language-server: $schema=https://openmsi.dev/schemas/openmsi-dialog-v1.schema.json

dialog:
  name: UserExit
  firstControl: Finish
  defaultControl: Finish
  cancelControl: Finish

controls:
  - type: Text
    name: Description
    text: "[ProductName] setup was interrupted. Your system has not been modified. To install this program at a later time, please run the installation again. Click the Finish button to exit the Setup Wizard."
    x: 135
    y: 80
    width: 220
    height: 80
    attributes: [Visible, Enabled, NoPrefix, Transparent]
  
  - type: Text
    name: Title
    text: "{\\OpenMSI_Font_Bigger}[ProductName] Setup Wizard was interrupted"
    x: 135
    y: 20
    width: 220
    height: 60
    attributes: [Visible, Enabled, NoPrefix, Transparent]

  - type: Bitmap
    name: Bitmap
    text: OpenMSI_BmpBackground
    x: 0
    y: 0
    width: 370
    height: 234
    nextControl: Back

  - type: Line
    name: BottomLine
    x: 0
    y: 234
    width: 370
    height: 0

  - type: PushButton
    name: Back
    text: "&Back"
    x: 180
    y: 243
    width: 56
    height: 17
    nextControl: Finish
    attributes: [Visible]

  - type: PushButton
    name: Finish
    text: "&Finish"
    x: 236
    y: 243
    width: 56
    height: 17
    nextControl: Cancel
    events:
      - event: EndDialog
        argument: Exit
  
  - type: PushButton
    name: Cancel
    text: Cancel
    x: 304
    y: 243
    width: 56
    height: 17
    nextControl: Bitmap
    attributes: [Visible]
