# yaml-language-server: $schema=https://openmsi.dev/schemas/openmsi-dialog-v1.schema.json

dialog:
  name: ExitDialog
  title: "[ProductName] Setup"
  firstControl: Finish
  defaultControl: Finish
  cancelControl: Finish

controls:
  - type: Text
    name: Title
    text: "{\\OpenMSI_Font_Bigger}Completed the [ProductName] Setup Wizard"
    x: 135
    y: 20
    width: 220
    height: 60
    attributes: [Visible, Enabled, NoPrefix, Transparent]

  - type: Text
    name: Description
    text: Click the Finish button to exit the Setup Wizard.
    x: 135
    y: 70
    width: 220
    height: 40
    attributes: [Visible, Enabled, NoPrefix, Transparent]

  - type: Bitmap
    name: Bitmap
    text: OpenMSI_BmpBackground
    x: 0
    y: 0
    width: 370
    height: 234
    nextControl: Back

  - type: CheckBox
    name: OptionalCheckBox
    text: "[WIXUI_EXITDIALOGOPTIONALCHECKBOXTEXT]"
    x: 135
    y: 190
    width: 220
    height: 40
    property: WIXUI_EXITDIALOGOPTIONALCHECKBOX
    nextControl: Finish
    attributes: [Enabled]
    conditions:
      - action: Show
        condition: WIXUI_EXITDIALOGOPTIONALCHECKBOXTEXT AND NOT Installed

  - type: Text
    name: OptionalText
    text: "[WIXUI_EXITDIALOGOPTIONALTEXT]"
    x: 135
    y: 110
    width: 220
    height: 80
    attributes: [Enabled, NoPrefix, Transparent]
    conditions:
      - action: Show
        condition: WIXUI_EXITDIALOGOPTIONALTEXT AND NOT Installed

  - type: Line
    name: BottomLine
    x: 0
    y: 234
    width: 370
    height: 0

  - type: PushButton
    name: Cancel
    text: Cancel
    x: 304
    y: 243
    nextControl: Bitmap
    events:
      - event: EndDialog
        argument: Return
        condition: "1"

  - type: PushButton
    name: Finish
    text: "&Finish"
    x: 236
    y: 243
    nextControl: Cancel
    events:
      - event: EndDialog
        argument: Return
        condition: "1"

  - type: PushButton
    name: Back
    text: "&Back"
    x: 180
    y: 243
    nextControl: OptionalCheckBox
    attributes: [Visible]
    events:
      - event: EndDialog
        argument: Return
        condition: "1"
