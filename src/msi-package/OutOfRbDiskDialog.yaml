# yaml-language-server: $schema=https://openmsi.dev/schemas/openmsi-dialog-v1.schema.json

dialog:
  name: OutOfRbDiskDlg
  firstControl: "No"
  defaultControl: "No"
  cancelControl: "No"

controls:
  - type: Text
    name: Title
    text: "{\\OpenMSI_Font_Title}Out of Disk Space"
    x: 15
    y: 6
    width: 200
    height: 15
    attributes: [Visible, Enabled, NoPrefix, Transparent]

  - type: Text
    name: Description
    text: Disk space required for the installation exceeds available disk space.
    x: 20
    y: 20
    width: 280
    height: 20
    attributes: [Visible, Enabled, NoPrefix, Transparent]

  - type: Bitmap
    name: BannerBitmap
    text: OpenMSI_BmpTopBanner
    x: 0
    y: 0
    width: 370
    height: 44
    nextControl: "No"

  - type: Line
    name: BannerLine
    x: 0
    y: 44
    width: 370
    height: 0

  - type: Text
    name: Text
    text: The highlighted volumes do not have enough disk space available for the current installation. You can remove some files from the highlighted volumes or select a different destination drive. Alternatively, you may choose to disable the installer's rollback functionality. Disabling rollback prevents the installer from restoring your computer's original state should the installation be interrupted in any way. Click Yes if you wish to take the risk of disabling rollback.
    x: 20
    y: 53
    width: 330
    height: 90

  - type: VolumeCostList
    name: VolumeList
    text: "{120}{70}{70}{70}{70}"
    x: 20
    y: 150
    width: 330
    height: 70
    attributes: [Visible, Sunken, Enabled, FixedVolume, RemoteVolume, ShowRollbackCost]

  - type: Line
    name: BottomLine
    x: 0
    y: 234
    width: 370
    height: 0

  - type: PushButton
    name: "No"
    text: "&No"
    x: 304
    y: 243
    nextControl: "Yes"
    events:
      - event: EndDialog
        argument: Return

  - type: PushButton
    name: "Yes"
    text: "&Yes"
    x: 240
    y: 243
    nextControl: BannerBitmap
    events:
      - event: EnableRollback
        argument: "False"
      - event: EndDialog
        argument: Return
