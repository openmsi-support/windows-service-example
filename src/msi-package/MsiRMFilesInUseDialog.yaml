# yaml-language-server: $schema=https://openmsi.dev/schemas/openmsi-dialog-v1.schema.json

dialog:
  name: MsiRMFilesInUse
  firstControl: OK
  defaultControl: OK
  cancelControl: Cancel
  attributes: [Visible, Modal, Minimize, KeepModeless]

controls:
  - type: Text
    name: Title
    text: "{\\OpenMSI_Font_Title}Files in Use"
    x: 15
    y: 6
    width: 340
    height: 15
    attributes: [Visible, Enabled, NoPrefix, Transparent]

  - type: Text
    name: Description
    text: Some files that need to be updated are currently in use.
    x: 25
    y: 23
    width: 340
    height: 20
    attributes: [Visible, Enabled, NoPrefix, Transparent]

  - type: Bitmap
    name: BannerBitmap
    text: OpenMSI_BmpTopBanner
    x: 0
    y: 0
    width: 370
    height: 44
    nextControl: OK

  - type: Line
    name: BannerLine
    x: 0
    y: 44
    width: 370
    height: 0

  - type: Text
    name: Text
    text: The following applications are using files that need to be updated by this setup. You can let Setup Wizard close them and attempt to restart them or reboot the machine later.
    x: 20
    y: 55
    width: 330
    height: 45
  
  - type: ListBox
    name: list
    x: 20
    y: 100
    width: 330
    height: 80
    property: FileInUseProcess

  - type: RadioButtonGroup
    name: ShutdownOption
    x: 26
    y: 190
    width: 305
    height: 45
    property: OpenMsiRMOption
    nextControl: BannerBitmap
    attributes: [Visible, Enabled]
    items:
    - text: "&Close the applications and attempt to restart them."
      value: UseRM
      x: 0
      y: 0
      width: 295
      height: 16
    - text: "&Do not close applications. A reboot will be required."
      value: DontUseRM
      x: 0
      y: 20
      width: 295
      height: 16

  - type: Line
    name: BottomLine
    x: 0
    y: 234
    width: 370
    height: 0

  - type: PushButton
    name: OK
    text: "OK"
    x: 240
    y: 243
    nextControl: Cancel
    events:
      - event: EndDialog
        argument: Return
      - event: RMShutdownAndRestart
        argument: "0"
        condition: OpenMSIRMOption~="UseRM"
    
  - type: PushButton
    name: Cancel
    text: "Cancel"
    x: 304
    y: 243
    nextControl: ShutdownOption
    events:
      - event: EndDialog
        argument: Exit
