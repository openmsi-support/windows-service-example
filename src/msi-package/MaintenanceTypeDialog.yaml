# yaml-language-server: $schema=https://openmsi.dev/schemas/openmsi-dialog-v1.schema.json

dialog:
  name: MaintenanceTypeDlg
  firstControl: ChangeButton
  defaultControl: ChangeButton
  cancelControl: Cancel

controls:
  - type: Text
    name: Title
    text: "{\\OpenMSI_Font_Title}Change, repair, or remove installation"
    x: 15
    y: 6
    width: 340
    height: 15
    attributes: [Visible, Enabled, NoPrefix, Transparent]

  - type: Text
    name: Description
    text: Select the operation you wish to perform.
    x: 25
    y: 23
    width: 340
    height: 20
    attributes: [Visible, Enabled, NoPrefix, Transparent]

  - type: Bitmap
    name: BannerBitmap
    text: OpenMSI_BmpTopBanner
    x: 0
    y: 0
    width: 370
    height: 44
    nextControl: ChangeButton

  - type: Line
    name: BannerLine
    x: 0
    y: 44
    width: 370
    height: 0

  - type: PushButton
    name: RepairButton
    text: "Re&pair"
    x: 40
    y: 118
    width: 80
    help: Repair Installation|
    nextControl: RemoveButton
    conditions:
      - action: Disable
        condition: ARPNOREPAIR OR BURNMSIMODIFY OR BURNMSIUNINSTALL
    events:
      - event: NewDialog
        argument: VerifyReadyDlg
      - event: "[OpenMSI_InstallMode]"
        argument: Repair

  - type: Text
    name: RepairText
    text: Repairs errors in the most recent installation by fixing missing and corrupt files, shortcuts, and registry entries.
    x: 60
    y: 138
    width: 280
    height: 30
    attributes: [Visible, Enabled]
    conditions:
      - action: Hide
        condition: ARPNOREPAIR OR BURNMSIMODIFY OR BURNMSIUNINSTALL

  - type: Text
    name: RepairDisabledText
    text: "[ProductName] cannot be repaired."
    x: 60
    y: 138
    width: 280
    height: 30
    attributes: [Enabled, NoPrefix]
    conditions:
      - action: Show
        condition: ARPNOREPAIR OR BURNMSIMODIFY OR BURNMSIUNINSTALL
    
  - type: PushButton
    name: RemoveButton
    text: "&Remove"
    x: 40
    y: 171
    width: 80 
    help: Remove Installation|
    nextControl: Back
    conditions:
      - action: Disable
        condition: ARPNOREMOVE OR BURNMSIREPAIR OR BURNMSIMODIFY
    events:
      - event: NewDialog
        argument: VerifyReadyDlg
      - event: "[OpenMSI_InstallMode]"
        argument: Remove

  - type: Text
    name: RemoveText
    text: "Removes [ProductName] from your computer."
    x: 60
    y: 191
    width: 280
    height: 20
    attributes: [Visible, Enabled, NoPrefix]
    conditions:
      - action: Hide
        condition: ARPNOREMOVE OR BURNMSIREPAIR OR BURNMSIMODIFY

  - type: Text
    name: RemoveDisabledText
    text: "[ProductName] cannot be removed."
    x: 60
    y: 191
    width: 280
    height: 20
    attributes: [Enabled, NoPrefix]
    conditions:
      - action: Show
        condition: ARPNOREMOVE OR BURNMSIREPAIR OR BURNMSIMODIFY
   
  - type: PushButton
    name: ChangeButton
    text: "&Change"
    x: 40
    y: 65
    width: 80
    help: Change Installation|
    nextControl: RepairButton
    conditions:
      - action: Disable
        condition: ARPNOMODIFY OR BURNMSIREPAIR OR BURNMSIUNINSTALL
    events:
      - event: "[OpenMSI_InstallMode]"
        argument: Change

  - type: Text
    name: ChangeText
    text: Lets you change the way features are installed.
    x: 60
    y: 85
    width: 280
    height: 20
    attributes: [Visible, Enabled]
    conditions:
      - action: Hide
        condition: ARPNOMODIFY OR BURNMSIREPAIR OR BURNMSIUNINSTALL

  - type: Text
    name: ChangeDisabledText
    text: "[ProductName] has no independently selectable features."
    x: 60
    y: 85
    width: 280
    height: 20
    attributes: [Enabled, NoPrefix]
    conditions:
      - action: Show
        condition: ARPNOMODIFY OR BURNMSIREPAIR OR BURNMSIUNINSTALL

  - type: Line
    name: BottomLine
    x: 0
    y: 234
    width: 370
    height: 0

  - type: PushButton
    name: Next
    text: "&Next"
    x: 236
    y: 243
    nextControl: Cancel
    attributes: [Visible]
    
  - type: PushButton
    name: Cancel
    text: "&Cancel"
    x: 304
    y: 243
    nextControl: BannerBitmap
    events:
      - event: SpawnDialog
        argument: CancelDlg

  - type: PushButton
    name: Back
    text: "&Back"
    x: 180
    y: 243
    nextControl: Next
    events:
      - event: NewDialog
        argument: MaintenanceWelcomeDlg